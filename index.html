<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: 키보드가 뜰 때 레이아웃 뷰포트(=100dvh)도 함께
         줄어든다. 기본값(resizes-visual)에서는 dvh가 그대로여서, 실측 visualViewport 높이로
         고정된 레슨 프레임 아래에 키보드에 가려진 죽은 영역이 남는다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>AI 교과서 — 발달장애 학생을 위한 AI 학습</title>
    <meta name="description" content="발달장애 학생을 위한 AI 학습 온라인 교과서입니다." />
    <meta name="theme-color" content="#2B3A55" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>이 사이트는 자바스크립트가 필요합니다.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
